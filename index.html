<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JS Interactive Assignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 id="main-title">Welcome to JS Fun!</h1>

    <button id="changeTextBtn">Click Me!</button>
    <p id="dynamicText">Watch this text change!</p>

    <div id="hoverBox">Hover Over Me</div>
    <p id="keyMessage">Press any key</p>

    <div class="image-slider">
      <img id="sliderImage" src="https://via.placeholder.com/300x200" alt="Slideshow" />
      <button id="nextImage">Next</button>
    </div>

    <div class="accordion">
      <h3 class="accordion-header">Click to Expand</h3>
      <div class="accordion-content">
        <p>This is hidden content that now appears!</p>
      </div>
    </div>

    <form id="signupForm">
      <h2>Sign Up</h2>
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <span id="passwordFeedback"></span>
      <button type="submit">Submit</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
